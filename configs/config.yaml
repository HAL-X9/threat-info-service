log:
  level: info

httpserver:
  addr: ":8080"

  timeouts:
    read_timeout: 10s
    read_header_timeout: 5s
    write_timeout: 30s
    idle_timeout: 120s

  max_header_bytes: 1048576
  max_body_bytes: 65536

  rate_limit:
    requests_per_second: 10
    burst: 20

database:
  pool:
    min_conns: 2
    max_conns: 10
    max_conn_lifetime: 1h
    max_conn_idle_time: 15m
    health_check_period: 30s

  timeouts:
    connect: 5s
    query: 5s
    transaction: 10s
